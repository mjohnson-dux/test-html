<div id="reservation-window"></div>

<script>
  (function() {
    function renderReservationWindow(baseDate) {
      var container = document.getElementById('reservation-window');
      if (!container) return;
      
      // Define min and max days and day of the week (0 = Sunday ... 6 = Saturday)
      var minDays = 14;
      var maxDays = 60;
      var targetDay = 6; // Saturday

      // Normalize server time to Eastern Time (America/New_York)
      var easternDateStr = baseDate.toLocaleDateString('en-US', { timeZone: 'America/New_York' });
      var today = new Date(easternDateStr);
      
      function formatDate(date) {
        return date.toLocaleDateString('en-US', {
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        });
      }
      
      // First targetDay AT LEAST minDays out (snaps forward)
      var startDate = new Date(today.getTime());
      startDate.setDate(startDate.getDate() + minDays);
      var daysForward = (targetDay - startDate.getDay() + 7) % 7;
      startDate.setDate(startDate.getDate() + daysForward);
      
      // Last targetDay NO MORE THAN maxDays out (snaps backward)
      var endDate = new Date(today.getTime());
      endDate.setDate(endDate.getDate() + maxDays);
      var daysBackward = (endDate.getDay() - targetDay + 7) % 7;
      endDate.setDate(endDate.getDate() - daysBackward);
      
      // Build elements via DOM methods so CivicPlus cannot strip closing tags
      container.innerHTML = '';
      
      var heading = document.createElement('h3');
      heading.style.textAlign = 'center';
      heading.style.color = '#003366';
      heading.textContent = 'Party Reservation Window:';
      
      var paragraph = document.createElement('p');
      paragraph.style.textAlign = 'center';
      
      var startStrong = document.createElement('strong');
      startStrong.style.color = '#3366cc';
      startStrong.textContent = formatDate(startDate);
      
      var endStrong = document.createElement('strong');
      endStrong.style.color = '#3366cc';
      endStrong.textContent = formatDate(endDate);
      
      paragraph.appendChild(document.createTextNode('Earliest Saturday to request: '));
      paragraph.appendChild(startStrong);
      paragraph.appendChild(document.createElement('br'));
      paragraph.appendChild(document.createTextNode('Latest Saturday to request: '));
      paragraph.appendChild(endStrong);
      
      container.appendChild(heading);
      container.appendChild(paragraph);
    }

    function init() {
      var xhr = new XMLHttpRequest();
      xhr.open('HEAD', window.location.href, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          var serverDateHeader = xhr.getResponseHeader('Date');
          var baseDate = serverDateHeader ? new Date(serverDateHeader) : new Date();
          renderReservationWindow(baseDate);
        }
      };
      xhr.onerror = function() {
        renderReservationWindow(new Date());
      };
      xhr.send(null);
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
